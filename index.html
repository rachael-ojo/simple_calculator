<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Simple Calculator</title>
</head>

<body>
    <header>
        <h1>Simple Calculator</h1>
        <p>How to calculate using this wonderful calculator</p>
    </header>

<section class="calculator-box">
        <div class="display">
            <input type="text" id="result" aria-label="Calculator display" disabled>  
        </div>

    <section class="buttons">
        <div class="button-container">
            <button class="number-btn">7</button>
            <button class="number-btn">8</button>
            <button class="number-btn">9</button>
            <button class="number-btn operator-btn">/</button>
        </div>
            
        <div class="button-container">
            <button class="number-btn">4</button>
            <button class="number-btn">5</button>
            <button class="number-btn">6</button>
            <button class="number-btn">*</button>
        </div>

        <div class="button-container">
            <button class="number-btn">1</button>
            <button class="number-btn">2</button>
            <button class="number-btn">3</button>
            <button class="number-btn operator-btn">-</button>
        </div>

        <div class="button-container">
            <button class="number-btn">0</button>
            <button class="number-btn operator-btn">.</button>
            <button class="number-btn operator-btn" id="equals">=</button>
            <button class="number-btn operator-btn">+</button>
        </div>
        
    <div class="action-buttons">
        <button id="clear">CLEAR</button>
        <button id="backspace">⌫</button>
    </div>
    </section>
    </section>
</div>
</section>

<script src="app.js"></script>   
</body>
</html>
